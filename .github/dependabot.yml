version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      openxml:
        patterns:
          - "DocumentFormat.OpenXml*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      mcp-sdk:
        patterns:
          - "ModelContextProtocol*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
